name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint + Typecheck + Testes + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Auditoria 2026-08: a CI rodava lint/typecheck/build e NÃO rodava a suíte — um PR que
      # quebrasse os testes passava com CI verde. Vem ANTES do build de propósito: teste é mais
      # rápido e falha mais cedo, e não faz sentido buildar código com teste quebrado.
      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
